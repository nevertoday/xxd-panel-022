    <rect width="1200" height="400" fill="url(#paper)"/>
    <rect x="773" y="108" width="349" height="221" fill="#111111"/>

    <!-- Body stays inside the field; the recognisable head is the single breakout. -->
    <path d="M845 317C837 275 845 226 874 192C891 172 906 158 926 149C946 139 976 140 997 151C1024 166 1044 194 1051 225C1059 261 1048 294 1028 318Z"
