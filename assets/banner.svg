<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 022</title>
  <desc>One source-bound subject sits mostly inside a pure-black rectangle while one defining feature breaks the boundary, rendered with clean stable hand line, white negative form, tiny grey planes, exactly one coral accent, and five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <clipPath id="blackField"><rect x="773" y="108" width="349" height="221"/></clipPath>
    <pattern id="paper" width="31" height="27" patternUnits="userSpaceOnUse">
      <path d="M3 7L12 6M20 21L28 19M6 26L12 25" stroke="#161616" stroke-opacity=".04" stroke-width=".8"/>
      <circle cx="23" cy="8" r=".6" fill="#161616" fill-opacity=".05"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
