    <text x="363" y="23" text-anchor="middle" fill="#161616" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
    <rect x="464" width="146" height="35" rx="6" fill="#D1D1CD" stroke="#161616" stroke-width="2"/>
    <text x="537" y="23" text-anchor="middle" fill="#161616" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text>
