    <path d="M908 154C897 141 895 124 897 108H984C984 128 976 145 961 154C946 164 921 164 908 154Z" fill="#F7F6F1" clip-path="url(#blackField)"/>
    <path d="M900 222C924 207 956 206 981 219M895 249C921 235 959 235 991 252M912 286C938 275 974 278 1002 294"
          stroke="#111111" stroke-width="2.4" stroke-linecap="round" clip-path="url(#blackField)"/>
    <path d="M922 124L927 121M955 121L960 124M937 137C944 141 949 141 955 136" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M1002 169L1036 151L1070 154" stroke="#F7F6F1" stroke-width="2.2" stroke-linecap="round" clip-path="url(#blackField)"/>
    <path d="M1027 264L1063 264" stroke="#F05B48" stroke-width="7" clip-path="url(#blackField)"/>
    <text x="1083" y="286" text-anchor="end" fill="#F7F6F1" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.1">ONE EDGE / 022</text>
    <text x="1110" y="349" text-anchor="end" fill="#161616" fill-opacity=".58" font-family="Arial, sans-serif" font-size="10" font-weight="700">中文 · EN · 日本語 · 한국어 · العربية</text>
  </g>

  <g transform="translate(62 50)">
    <text x="0" y="20" fill="#161616" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="104" fill="#161616" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL 022</text>
    <text x="2" y="143" fill="#161616" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".9">BLACK FIELD · CLEAN LINE · ONE COLOUR SIGNAL</text>
    <text x="2" y="183" fill="#161616" font-family="sans-serif" font-size="17" font-weight="700">纯黑色域 · 流畅稳定线 · 唯一单点彩色</text>
    <text x="2" y="212" fill="#161616" fill-opacity=".72" font-family="sans-serif" font-size="13" font-weight="600">純黒の領域 · 滑らかな線 · 一点だけの色</text>
    <text x="2" y="239" fill="#161616" fill-opacity=".72" font-family="sans-serif" font-size="13" font-weight="600">순검정 영역 · 매끄러운 선 · 색 신호 하나</text>
